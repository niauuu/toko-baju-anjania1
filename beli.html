<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beli Produk</title>

<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>

<div class="container">

<a href="produk.html">← Kembali ke Produk</a>

<div class="produk">

<div class="gambar">
<img src="images/baju1.jpg" alt="Produk">
</div>

<div class="detail">

<h1>Kaos Oversize</h1>

<h2 id="harga">Rp150.000</h2>

<p>Kategori : Kaos</p>
<p>Bahan : Cotton Combed 30s</p>
<p>Stok : <span id="stok">25</span></p>

<p>
Kaos oversize premium dengan bahan cotton combed yang nyaman dipakai.
</p>

<label>Jumlah</label>

<div class="qty">

<button onclick="kurang()">-</button>

<input type="number" id="jumlah" value="1" min="1">

<button onclick="tambah()">+</button>

</div>

<h3 id="total">Total : Rp150.000</h3>

<button onclick="beli()">Konfirmasi Pembelian</button>

</div>

</div>

</div>

<script>

let harga = 150000;
let stok = 25;

function update(){

let j = parseInt(document.getElementById("jumlah").value);

if(j<1)j=1;
if(j>stok)j=stok;

document.getElementById("jumlah").value=j;

document.getElementById("total").innerHTML =
"Total : Rp"+(harga*j).toLocaleString("id-ID");

}

function tambah(){

document.getElementById("jumlah").value++;

update();

}

function kurang(){

document.getElementById("jumlah").value--;

update();

}

function beli(){

alert("Pesanan berhasil ditambahkan.");

}

document.getElementById("jumlah").addEventListener("input",update);

</script>

</body>
</html>
